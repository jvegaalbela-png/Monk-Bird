<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shorter / Joe — Random Composition</title>
  <link rel="stylesheet" href="styles.css?v=1" />
</head>
<body>
  <main class="stage">
    <header class="bar">
      <h1>Shorter <span class="slash">/</span> Joe</h1>
      <div class="filters">
        <label><input type="checkbox" id="f-shorter" checked /> Shorter</label>
        <label><input type="checkbox" id="f-henderson" checked /> Henderson</label>
      </div>
    </header>

    <section class="card" id="card" aria-live="polite">
      <div class="cover" id="cover">
        <div class="vinyl">
          <div class="label">
            <span id="cover-title">—</span>
            <small id="cover-composer"></small>
          </div>
        </div>
      </div>
      <div class="meta">
        <div class="composer" id="composer">—</div>
        <h2 class="title" id="title">Press the button</h2>
        <dl class="facts">
          <div><dt>Composed</dt><dd id="composed">—</dd></div>
          <div><dt>First recorded</dt><dd id="recorded">—</dd></div>
          <div><dt>First recorded on</dt><dd id="album">—</dd></div>
        </dl>
        <p class="anecdote" id="anecdote"></p>
        <div class="actions">
          <a id="youtube" class="btn-link" href="#" target="_blank" rel="noopener">Listen on YouTube ↗</a>
        </div>
      </div>
    </section>

    <button id="shuffle" class="shuffle" type="button">Pick a random tune</button>

    <footer class="foot">
      <span id="count">—</span>
      <span class="sep">·</span>
      <a class="foot-link" href="../">Monk / Bird ↗</a>
    </footer>
  </main>

  <script src="data.js?v=1"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
